[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "liquipedia-mcp"
dynamic = ["version"]
description = "Rate-limited, cache-first client and MCP server for the Liquipedia LPDB v3 API (match results, schedules, standings)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lion Scherer" }]
requires-python = ">=3.11"
keywords = ["liquipedia", "lpdb", "esports", "mcp", "model-context-protocol", "rocket-league", "league-of-legends"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
liquipedia-mcp = "liquipedia_mcp.cli:main"

[project.urls]
Source = "https://github.com/LionScherer/liquipedia-mcp"
Issues = "https://github.com/LionScherer/liquipedia-mcp/issues"

[tool.hatch.version]
path = "src/liquipedia_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/liquipedia_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
